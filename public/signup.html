<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a College Library account.">
    <title>Sign Up — College Library</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="site-logo"><span class="logo-icon">📚</span><span>College Library</span></a>
            <nav><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="books.html">Books</a></li><li><a href="login.html" class="btn-login">Login</a></li></ul></nav>
        </div>
    </header>
    <main class="page-content">
        <div class="container">
            <div class="login-container">
                <h2>Create Your Account</h2>
                <p class="login-subtitle">Register as a library member</p>
                <div class="login-error" id="signup-message" role="alert"></div>
                <form id="signup-form">
                    <div class="form-group"><label for="signup-name">Full Name</label><input id="signup-name" required autocomplete="name"></div>
                    <div class="form-group"><label for="signup-email">Email Address</label><input type="email" id="signup-email" required autocomplete="email"></div>
                    <div class="form-group"><label for="signup-phone">Phone Number</label><input type="tel" id="signup-phone" autocomplete="tel"></div>
                    <div class="form-group"><label for="signup-department">Department</label><input id="signup-department" placeholder="e.g. Computer Science" required></div>
                    <div class="form-group"><label for="signup-type">Register As</label><select id="signup-type" required><option value="">— Select Member Type —</option><option value="Student">Student</option><option value="Teacher">Teacher</option><option value="Non-Teaching Staff">Non-Teaching Staff</option><option value="Librarian">Librarian</option></select></div>
                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="signup-password" minlength="6" required autocomplete="new-password">
                            <button type="button" class="password-toggle-btn" id="toggle-signup-password" aria-label="Show password" title="Show/Hide password">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="signup-confirm-password">Confirm Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="signup-confirm-password" minlength="6" required autocomplete="new-password">
                            <button type="button" class="password-toggle-btn" id="toggle-signup-confirm" aria-label="Show password" title="Show/Hide password">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Account</button>
                </form>
                <div class="login-footer"><p>Already have an account? <a href="login.html">Log in</a></p></div>
            </div>
        </div>
    </main>
    <footer class="site-footer"><div class="container"><p>College Library Management System</p></div></footer>
    <script src="js/api.js"></script>
    <script src="js/data.js"></script>
    <script>
        function setupPasswordToggle(btnId, inputId) {
            const btn = document.getElementById(btnId);
            const input = document.getElementById(inputId);
            if (!btn || !input) return;
            btn.addEventListener("click", function () {
                const isPassword = input.type === "password";
                input.type = isPassword ? "text" : "password";
                this.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
                this.innerHTML = isPassword ?
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>' :
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
            });
        }
        setupPasswordToggle("toggle-signup-password", "signup-password");
        setupPasswordToggle("toggle-signup-confirm", "signup-confirm-password");
        document.getElementById('signup-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const message = document.getElementById('signup-message');
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm-password').value;
            if (password !== confirmPassword) {
                message.textContent = 'Passwords do not match.';
                message.style.display = 'block';
                message.style.background = '#fee2e2';
                message.style.color = '#991b1b';
                return;
            }
            const payload = {
                name: document.getElementById('signup-name').value.trim(),
                email: document.getElementById('signup-email').value.trim(),
                phone: document.getElementById('signup-phone').value.trim(),
                department: document.getElementById('signup-department').value.trim(),
                userType: document.getElementById('signup-type').value,
                password: password
            };
            try {
                const data = await LibraryAPI.signup(payload);
                message.textContent = data.message || (data.success ? 'Account created successfully! Redirecting...' : 'Failed to create account.');
                message.style.display = 'block';
                message.style.background = data.success ? '#d1fae5' : '#fee2e2';
                message.style.color = data.success ? '#065f46' : '#991b1b';
                
                if (data.success) {
                    sessionStorage.setItem('registered_user', JSON.stringify({
                        email: payload.email,
                        userType: payload.userType,
                        userId: data.user_id || payload.email
                    }));
                    setTimeout(function () {
                        window.location.href = 'login.html?registered=true';
                    }, 1200);
                }
            } catch (err) {
                message.textContent = 'Error creating account: ' + err.message;
                message.style.display = 'block';
                message.style.background = '#fee2e2';
                message.style.color = '#991b1b';
            }
        });
    </script>
</body>
</html>
