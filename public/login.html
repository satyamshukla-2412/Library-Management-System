<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to the College Library Management System. Access for Students, Teachers, and Staff.">
    <title>Login — College Library</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="site-logo">
                <span class="logo-icon">📚</span>
                <span>College Library</span>
            </a>
            <button class="hamburger" id="hamburger-btn" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>
            <nav>
                <ul class="nav-links" id="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="books.html">Books</a></li>
                    <li><a href="rules.html">Rules</a></li>
                    <li><a href="about.html">About</a></li>
                    <li class="nav-login-link"><a href="login.html" class="btn-login">Login</a></li>
                    <li class="nav-account-link" style="display:none"><a href="account.html">My Account</a></li>
                    <li class="nav-librarian-link" style="display:none"><a href="librarian.html">Dashboard</a></li>
                    <li class="nav-logout-link" style="display:none"><a href="#" onclick="logoutUser(); window.location.href='index.html'; return false;">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="page-content">
        <div class="container">
            <div class="login-container">
                <h2>Library Login</h2>
                <p class="login-subtitle">Access your library account</p>

                <div class="login-error" id="login-error"></div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="login-userid">User ID, Email, or Member ID</label>
                        <input type="text" id="login-userid" placeholder="e.g. STU2023001 or name@college.edu.in" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="login-password" placeholder="Enter your password" required>
                            <button type="button" class="password-toggle-btn" id="toggle-login-password" aria-label="Show password" title="Show/Hide password">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="login-type">Login As</label>
                        <select id="login-type" required>
                            <option value="">— Select User Type —</option>
                            <option value="Student">Student</option>
                            <option value="Teacher">Teacher</option>
                            <option value="Non-Teaching Staff">Non-Teaching Staff</option>
                            <option value="Librarian">Librarian</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>

                <div class="login-footer">
                    <p>New to the library? <a href="signup.html"><strong>Create an account</strong></a></p>
                    <a href="#" onclick="showToast('Please contact the library administrator to reset your password.', 'info'); return false;">Forgot Password?</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>College Library Management System</p>
            <p>© 2026 Department of Computer Engineering</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Password visibility toggle
            const togglePwdBtn = document.getElementById("toggle-login-password");
            const pwdInput = document.getElementById("login-password");
            if (togglePwdBtn && pwdInput) {
                togglePwdBtn.addEventListener("click", function () {
                    const isPassword = pwdInput.type === "password";
                    pwdInput.type = isPassword ? "text" : "password";
                    this.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
                    this.innerHTML = isPassword ?
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>' :
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
                });
            }
            // If already logged in, redirect
            if (isLoggedIn()) {
                var user = getCurrentUser();
                if (user.user_type === "Librarian") {
                    window.location.href = "librarian.html";
                } else {
                    window.location.href = "account.html";
                }
                return;
            }

            var form = document.getElementById("login-form");
            var errorEl = document.getElementById("login-error");

            // Auto-fill if redirected from signup page
            var regUserRaw = sessionStorage.getItem("registered_user");
            if (regUserRaw) {
                try {
                    var regUser = JSON.parse(regUserRaw);
                    if (regUser.email) {
                        document.getElementById("login-userid").value = regUser.email;
                    }
                    if (regUser.userType) {
                        document.getElementById("login-type").value = regUser.userType;
                    }
                    errorEl.textContent = "Account created successfully! Enter your password to log in.";
                    errorEl.style.display = "block";
                    errorEl.style.background = "#d1fae5";
                    errorEl.style.color = "#065f46";
                    errorEl.style.borderColor = "#a7f3d0";
                    sessionStorage.removeItem("registered_user");
                } catch (err) {}
            }

            form.addEventListener("submit", async function (e) {
                e.preventDefault();

                var userId = document.getElementById("login-userid").value.trim();
                var password = document.getElementById("login-password").value;
                var userType = document.getElementById("login-type").value;

                if (!userId || !password || !userType) {
                    errorEl.textContent = "Please fill in all fields.";
                    errorEl.style.display = "block";
                    errorEl.style.background = "";
                    errorEl.style.color = "";
                    return;
                }

                var result = await LibraryAPI.login(userId, password, userType);

                if (result.success) {
                    errorEl.style.display = "none";
                    showToast("Login successful! Welcome, " + result.user.name, "success");

                    setTimeout(function () {
                        if (result.user.user_type === "Librarian") {
                            window.location.href = "librarian.html";
                        } else {
                            window.location.href = "account.html";
                        }
                    }, 800);
                } else {
                    errorEl.textContent = result.message;
                    errorEl.style.display = "block";
                    errorEl.style.background = "";
                    errorEl.style.color = "";
                }
            });
        });
    </script>
</body>
</html>
